name: Validate LGPL MPVKit adapter
on:
  push:
    branches: [main]
    paths:
      - 'adapters/MPVKit/**'
      - '.github/workflows/adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse MPVKit package and verify dynamic FFmpeg targets
        run: |
          set -euo pipefail
          swift package dump-package --package-path adapters/MPVKit > /tmp/mpvkit.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/mpvkit.json'))
          t={x['name']:x for x in data['targets']}
          expected={'Libavcodec','Libavdevice','Libavfilter','Libavformat','Libavutil','Libswresample','Libswscale'}
          assert expected.issubset(t),sorted(set(expected)-set(t))
          for name in expected:
              assert 'albaintor/ffmpeg-apple/releases/download/build-v8.1.3-r1' in json.dumps(t[name]),name
          assert not any(name.endswith('-GPL') for name in t),list(t)
          assert (data['products'][0]['name'] if 'name' in data['products'][0] else True)
          print('All seven FFmpeg targets use the published dynamic LGPL XCFrameworks')
          PY
