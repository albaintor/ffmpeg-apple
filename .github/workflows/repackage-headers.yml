name: Repackage Swift headers for dynamic FFmpeg r2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repackage-headers.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repackage proven dynamic Mach-O binaries with corrected module interface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view build-v8.1.3-r2 >/dev/null 2>&1; then
            echo "r2 already published: no overwrite"
            exit 0
          fi
          mkdir -p dist
          gh release download build-v8.1.3-r1 -D dist \
            -p '*.xcframework.zip' -p 'FFmpeg-*-source.zip' \
            -p 'config-*' -p 'build-manifest.json'
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          root=pathlib.Path('dist')
          target=root/'Libavutil.xcframework.zip'
          original=target.read_bytes()
          temp=root/'Libavutil-patched.zip'
          count=0
          with zipfile.ZipFile(target) as z_in, zipfile.ZipFile(temp,'w') as z_out:
              for info in z_in.infolist():
                  raw=z_in.read(info.filename)
                  if info.filename.endswith('/Libavutil.framework/Headers/Libavutil.h'):
                      s=raw.decode()
                      needle='#include "libavutil/avutil.h"'
                      assert needle in s,info.filename
                      assert "samplefmt.h" not in s,info.filename
                      s=s.replace(needle,needle+'\\n#include "libavutil/samplefmt.h"')
                      raw=s.encode()
                      count+=1
                  z_out.writestr(info,raw)
          assert count==2,f"Expected one header in each XCFramework slice, got {count}"
          os.replace(temp,target)
          meta_path=root/'build-manifest.json'
          m=json.loads(meta_path.read_text())
          assert m['git_sha']=='1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7'
          assert len(m['ffmpeg_libraries'])==7
          m['ffmpeg_libraries']['Libavutil']['sha256']=hashlib.sha256(target.read_bytes()).hexdigest()
          m['packaging_note']='Release r2: only public Libavutil Swift umbrella headers updated; Mach-O binaries unchanged from r1'
          for item in [*m['ffmpeg_libraries'].values(),m['source_archive']]:
              file=root/item['file']
              assert hashlib.sha256(file.read_bytes()).hexdigest()==item['sha256'],file
          meta_path.write_text(json.dumps(m,indent=2)+'\n')
          print('Verified',count,'headers and all checksum-pinned XCFrameworks')
          PY
          python3 scripts/make_swiftpm.py \
            --manifest dist/build-manifest.json --tag build-v8.1.3-r2 \
            --output dist/Package.swift
          gh release create build-v8.1.3-r2 \
            --target 22c470085540983017e0c7e186cd368f5ad45281 \
            --title "FFmpeg 8.1.3 dynamic XCFrameworks - Swift API r2" \
            --notes "LGPL dynamic FFmpeg based on tested r1. Mach-O binaries unchanged; the Libavutil framework umbrella headers now also export samplefmt.h required by PrismCore. Full original source and build configuration included; consuming-app LGPL compliance not certified." \
            dist/Lib*.xcframework.zip dist/FFmpeg-*-source.zip \
            dist/config-*.mak dist/config-*.h dist/build-manifest.json
          mkdir -p tmp-package
          cp dist/Package.swift tmp-package/Package.swift
          git -C tmp-package init -q
          git -C tmp-package add Package.swift
          git -C tmp-package -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm 'SwiftPM dynamic FFmpeg Apple r2'
          git -C tmp-package tag v8.1.3-r2
          git -C tmp-package remote add origin \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C tmp-package push origin v8.1.3-r2
