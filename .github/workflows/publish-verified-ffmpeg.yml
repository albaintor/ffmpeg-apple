name: Publish verified FFmpeg iOS artifact

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-verified-ffmpeg.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful build workflow run containing ffmpeg-ios-xcframeworks"
        required: true
        type: string
      release_tag:
        description: "Immutable release tag, e.g. build-v8.1.3-r6"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify complete FFmpeg build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || '42006129788' }}
          RELEASE_TAG: ${{ inputs.release_tag || 'build-v8.1.3-r5' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid run id"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^build-v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already published; refusing overwrite"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          run=json.load(open("run.json"))
          assert run["conclusion"]=="success", "Build workflow not successful"
          assert run["repository"]["full_name"]==os.environ["GITHUB_REPOSITORY"]
          assert run["name"].startswith("FFmpeg iOS LGPL dynamic XCFrameworks"), "Wrong workflow"
          print("Validated workflow run:",run["html_url"],"commit",run["head_sha"])
          PY
          mkdir -p dist
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n ffmpeg-ios-xcframeworks -D dist
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          d=pathlib.Path("dist")
          m=json.loads((d/"build-manifest.json").read_text())
          names={"Libavcodec","Libavdevice","Libavfilter","Libavformat","Libavutil","Libswresample","Libswscale"}
          assert set(m["ffmpeg_libraries"])==names, "Incomplete FFmpeg binaries"
          assert m["git_sha"]=="1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7", "Unexpected FFmpeg base"
          assert any(p.get("name")=="movenc-preserve-pts-on-dts-correction" for p in m.get("source_modifications",[])), "PTS correction missing"
          for item in [*m["ffmpeg_libraries"].values(),m["source_archive"]]:
              p=d/item["file"]
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item["sha256"],p
          with zipfile.ZipFile(d/m["source_archive"]["file"]) as z:
              source=[p for p in z.namelist() if p.endswith("/libavformat/movenc.c")]
              assert len(source)==1
              assert b"Preserve presentation offset when correcting decode timestamp" in z.read(source[0])
          for lib,item in m["ffmpeg_libraries"].items():
              with zipfile.ZipFile(d/item["file"]) as z:
                  files=z.namelist()
                  marker=f"{lib}.framework.dSYM/Contents/Resources/DWARF/{lib}"
                  syms=[p for p in files if p.endswith(marker)]
                  # Build pipeline must supply original iPhone and Simulator symbols.
                  assert len(syms)>=2, f"{lib}: missing iPhone or Simulator dSYMs: {syms}"
                  binaries=[p for p in files if p.endswith(f"{lib}.framework/{lib}")]
                  assert len(binaries)>=2, f"{lib}: incomplete XCFramework slices"
                  print(lib,"verified device+simulator dSYM and binaries")
          for cfg in ["config-iphoneos.mak","config-iphonesimulator.mak"]:
              config=(d/cfg).read_text()
              for required in ("CONFIG_ZLIB=yes","CONFIG_BZLIB=yes"):
                  assert required in config,required
              import re
              for forbidden in ("CONFIG_GPL=yes","CONFIG_NONFREE=yes","CONFIG_VERSION3=yes"):
                  assert not re.search(r"^" + re.escape(forbidden) + r"$", config, re.MULTILINE), forbidden
          print("All SHA-256 checks and patched-source audit passed")
          PY
          # Link to the exact successful build commit, not the publisher commit.
          build_sha=$(python3 -c 'import json;print(json.load(open("run.json"))["head_sha"])')
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --target "$build_sha" \
            --title "FFmpeg 8.1.3 LGPL iOS - movenc PTS fix ($RELEASE_TAG)" \
            --notes "FFmpeg n8.1.3 with a scoped movenc PTS-preservation fix, verified build manifest, full matching modified source, 7 dynamic XCFrameworks and original device+simulator dSYMs. See build run #$RUN_ID. Requires application-level LGPL compliance review." \
            dist/Lib*.xcframework.zip dist/FFmpeg-*-source.zip \
            dist/config-*.mak dist/config-*.h dist/build-manifest.json
          echo "Published immutable $RELEASE_TAG"
