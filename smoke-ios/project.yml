name: DynamicFFmpegSmoke
options:
  bundleIdPrefix: fr.albaintor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  PrismCore:
    path: ..
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    exactVersion: 4.0.3
targets:
  DynamicFFmpegSmoke:
    platform: iOS
    type: application
    sources:
      - path: SmokeApp.swift
    dependencies:
      - package: PrismCore
      - package: AMSMB2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.albaintor.dynamicffmpegsmoke
        GENERATE_INFOPLIST_FILE: "YES"
