name: DynamicFFmpegSmoke
options:
  bundleIdPrefix: fr.albaintor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  PrismCore:
    url: https://github.com/Wenzlik/PrismCore.git
    exactVersion: 3.8.0
  MPVKit:
    path: ../adapters/MPVKit
targets:
  DynamicFFmpegSmoke:
    platform: iOS
    type: application
    sources:
      - path: SmokeApp.swift
    dependencies:
      - package: PrismCore
      - package: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.albaintor.dynamicffmpegsmoke
        GENERATE_INFOPLIST_FILE: "YES"
